<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钻石版分布地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e1a; color: #e8f0ff;
  }

  #map { position: absolute; inset: 0; }

  /* ========== 抽屉侧边栏 ========== */
  #sidebar {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 380px; max-width: 86vw;
    background: linear-gradient(180deg, #0d1321 0%, #111830 100%);
    border-right: 1px solid rgba(0,240,255,0.25);
    display: flex; flex-direction: column;
    box-shadow: 2px 0 24px rgba(0,240,255,0.12);
    z-index: 1000;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(.25,.8,.25,1);
  }
  #sidebar.open { transform: translateX(0); }
  #backdrop {
    position: absolute; inset: 0;
    background: rgba(2,6,18,0.65);
    z-index: 999;
    opacity: 0; visibility: hidden;
    transition: opacity .25s, visibility .25s;
  }
  #backdrop.open { opacity: 1; visibility: visible; }

  .sidebar-header {
    padding: 16px 18px;
    background: linear-gradient(135deg, #00f0ff 0%, #9d5cff 60%, #ff2d78 100%);
    color: #0a0e1a;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 20px rgba(157,92,255,0.35);
  }
  .sidebar-header h1 {
    font-size: 17px; font-weight: 800; flex: 1;
    color: #fff; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 16px rgba(0,240,255,0.5);
  }
  .sidebar-header .sub { font-size: 11px; opacity: .95; margin-top: 2px; color: #e6ffff; }
  .header-text { flex: 1; }

  /* 顶栏右侧操作区 */
  .header-actions {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .theme-btn:hover { background: rgba(0,0,0,0.45); box-shadow: 0 0 12px rgba(0,240,255,0.6); }

  /* 名称显示开关 */
  .label-toggle {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
    flex-shrink: 0;
  }
  .label-toggle .switch-label { font-size: 11px; color: #e6ffff; font-weight: 600; white-space: nowrap; }
  .switch {
    position: relative; width: 38px; height: 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.4);
    transition: all .25s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transition: all .25s;
    box-shadow: 0 0 6px rgba(0,0,0,0.3);
  }
  .label-toggle.on .switch {
    background: linear-gradient(135deg, #00f0ff, #ff2d78);
    border-color: #fff;
    box-shadow: 0 0 10px rgba(0,240,255,0.6);
  }
  .label-toggle.on .switch::after { left: 20px; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 12px 14px; background: #0d1321;
    border-bottom: 1px solid rgba(0,240,255,0.15); flex-shrink: 0;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 800; }
  .stat-label { font-size: 10px; color: #7d8db8; margin-top: 2px; }
  .stat.s1 .stat-num { color: #ff4d6d; }
  .stat.s2 .stat-num { color: #00b8ff; }
  .stat.s3 .stat-num { color: #ffd700; }
  .stat.s4 .stat-num { color: #00e676; }

  /* 类型统计（可点击卡片式筛选） */
  .type-stats {
    background: #0d1321;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0,240,255,0.15);
    gap: 6px;
  }
  /* 区域统计（可点击卡片式筛选） */
  .dist-stats {
    background: #0d1321;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0,240,255,0.15);
    gap: 6px;
    grid-template-columns: repeat(5, 1fr);
  }
  .dist-stats .stat,
  .type-stats .stat {
    padding: 6px 2px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    border: 1px solid rgba(0,240,255,0.12);
    background: rgba(0,240,255,0.05);
  }
  .dist-stats .stat:hover,
  .type-stats .stat:hover {
    background: rgba(0,240,255,0.12);
    box-shadow: 0 0 12px rgba(0,240,255,0.3) inset;
  }
  .dist-stats .stat.active,
  .type-stats .stat.active {
    background: linear-gradient(135deg, #00f0ff 0%, #9d5cff 100%);
    color: #0a0e1a;
    border-color: #ff2d78;
    box-shadow: 0 0 16px rgba(0,240,255,0.6);
  }
  .dist-stats .stat.active .stat-num,
  .dist-stats .stat.active .stat-label,
  .type-stats .stat.active .stat-num,
  .type-stats .stat.active .stat-label { color: #0a0e1a; }
  .dist-stats .stat.d-城中区 .stat-num { color: #ff4d6d; }
  .dist-stats .stat.d-城西区 .stat-num { color: #00b8ff; }
  .dist-stats .stat.d-城东区 .stat-num { color: #ffd700; }
  .dist-stats .stat.d-城北区 .stat-num { color: #00e676; }
  .dist-stats .stat.d-all .stat-num { color: #00f0ff; }
  .dist-stats .stat-label { font-size: 10px; color: #7d8db8; }
  .dist-stats .stat.active .stat-label,
  .type-stats .stat.active .stat-label { color: #0a0e1a; }
  .type-stats .stat.t-网咖 .stat-num { color: #ff9f2e; }
  .type-stats .stat.t-酒店 .stat-num { color: #00b8ff; }
  .type-stats .stat.t-混合 .stat-num { color: #00e676; }
  .type-stats .stat.t-all .stat-num { color: #00f0ff; }
  .type-stats .stat-label { font-size: 11px; color: #7d8db8; }

  /* 弹层内统计 */
  .popup-title { font-size: 12px; color: #7d8db8; margin-bottom: 6px; text-align: center; }
  .popup-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .popup-stats .stat {
    padding: 6px 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    border: 1px solid rgba(0,240,255,0.12);
    background: rgba(0,240,255,0.05);
  }
  .popup-stats .stat:hover { background: rgba(0,240,255,0.12); }
  .popup-stats .stat.active {
    background: linear-gradient(135deg, #00f0ff 0%, #9d5cff 100%);
    color: #0a0e1a;
    border-color: #ff2d78;
    box-shadow: 0 0 16px rgba(0,240,255,0.6);
  }
  .popup-stats .stat.active .stat-num,
  .popup-stats .stat.active .stat-label { color: #0a0e1a; }
  .popup-stats .stat.t-网咖 .stat-num { color: #ff9f2e; }
  .popup-stats .stat.t-酒店 .stat-num { color: #00b8ff; }
  .popup-stats .stat.t-混合 .stat-num { color: #00e676; }
  .popup-stats .stat.t-all .stat-num { color: #00f0ff; }

  .search-box { padding: 10px 14px; background: #0d1321; border-bottom: 1px solid rgba(0,240,255,0.15); flex-shrink: 0; }
  .search-box input {
    width: 100%; padding: 8px 12px;
    background: #0a0e1a; border: 1px solid rgba(0,240,255,0.25);
    border-radius: 8px; color: #e8f0ff; font-size: 13px;
    transition: all .2s;
  }
  .search-box input::placeholder { color: #4a5a80; }
  .search-box input:focus { outline: none; border-color: #00f0ff; box-shadow: 0 0 0 3px rgba(0,240,255,0.15), 0 0 14px rgba(0,240,255,0.3); }

  .filter-chips { display: flex; gap: 6px; padding: 0 14px 10px; background: #0d1321; flex-wrap: wrap; border-bottom: 1px solid rgba(0,240,255,0.15); flex-shrink: 0; }
  .chip {
    padding: 4px 11px; border-radius: 14px; font-size: 12px;
    background: rgba(0,240,255,0.08); color: #9fd8e8; cursor: pointer;
    transition: all .2s; border: 1px solid rgba(0,240,255,0.2);
  }
  .chip:hover { background: rgba(0,240,255,0.18); }
  .chip.active { background: linear-gradient(135deg, #00f0ff, #ff2d78); color: #0a0e1a; border-color: #00f0ff; box-shadow: 0 0 12px rgba(0,240,255,0.4); }

  .list-wrap { flex: 1; overflow-y: auto; background: #0d1321; -webkit-overflow-scrolling: touch; }
  .list-wrap::-webkit-scrollbar { width: 6px; }
  .list-wrap::-webkit-scrollbar-track { background: #0a0e1a; }
  .list-wrap::-webkit-scrollbar-thumb { background: #2a3a5c; border-radius: 3px; }

  .list-item {
    padding: 11px 16px;
    border-bottom: 1px solid rgba(0,240,255,0.1);
    cursor: pointer; transition: all .15s;
  }
  .list-item:hover { background: rgba(0,240,255,0.06); }
  .list-item.active { background: rgba(157,92,255,0.12); border-left: 3px solid #00f0ff; padding-left: 13px; }
  .list-item .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .list-item .num {
    width: 26px; height: 26px; border-radius: 50%;
    color: #0a0e1a; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .list-item .num.d-城中区 { background: #ff4d6d; }
  .list-item .num.d-城西区 { background: #00b8ff; }
  .list-item .num.d-城东区 { background: #ffd700; }
  .list-item .num.d-城北区 { background: #00e676; }
  .list-item .name { font-size: 14px; font-weight: 600; color: #e8f0ff; flex: 1; }
  .list-item .dist-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: rgba(0,240,255,0.12); color: #00f0ff; flex-shrink: 0;
  }
  .list-item .type-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    margin-left: 4px;
  }
  .type-tag.t-电竞网咖 { background: rgba(255,159,46,0.15); color: #ff9f2e; }
  .type-tag.t-电竞酒店 { background: rgba(0,184,255,0.15); color: #00b8ff; }
  .type-tag.t-电竞网咖+电竞酒店 { background: rgba(0,230,118,0.15); color: #00e676; }
  .type-emoji { font-size: 13px; }
  .list-item .addr { font-size: 12px; color: #7d8db8; line-height: 1.5; padding-left: 30px; }
  .empty { padding: 40px 20px; text-align: center; color: #4a5a80; font-size: 13px; }

  /* 自定义标记 */
  .custom-marker {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    transform-origin: top center;
  }
  .marker-inner {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #0a0e1a; font-size: 13px; font-weight: 800;
    border: 2px solid rgba(0,0,0,0.4);
    box-shadow: 0 0 10px rgba(0,240,255,0.45), 0 2px 6px rgba(0,0,0,0.4);
    transition: all .2s;
  }
  .marker-label {
    margin-top: 2px;
    max-width: 220px;
    padding: 2px 6px;
    background: rgba(10,14,26,0.85);
    border: 1px solid rgba(0,240,255,0.35);
    border-radius: 4px;
    color: #e8f0ff; font-size: 10px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 4px rgba(0,0,0,0.6);
    transition: all .2s;
  }
  .marker-inner:hover { transform: scale(1.2); }
  .marker-inner.active {
    transform: scale(1.35);
    border-color: #ffd700;
    box-shadow: 0 0 18px #ff2d78, 0 0 8px rgba(0,240,255,0.7);
  }
  .marker-inner.d-城中区 { background: #ff4d6d; }
  .marker-inner.d-城西区 { background: #00b8ff; }
  .marker-inner.d-城东区 { background: #ffd700; }
  .marker-inner.d-城北区 { background: #00e676; }

  /* 信息窗 */
  .amap-info-content {
    padding: 12px 14px !important; border-radius: 10px !important; min-width: 200px;
    background: #111830 !important;
    border: 1px solid rgba(0,240,255,0.4) !important;
    box-shadow: 0 0 24px rgba(0,240,255,0.3) !important;
  }
  .amap-info-close { top: 6px !important; right: 8px !important; color: #00f0ff !important; }
  .iw-name { font-size: 15px; font-weight: 800; color: #e8f0ff; margin-bottom: 4px; text-shadow: 0 0 8px rgba(0,240,255,0.4); }
  .iw-dist {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; background: rgba(0,240,255,0.15); color: #00f0ff; margin-bottom: 8px;
  }
  .iw-addr { font-size: 12px; color: #9fb4d8; line-height: 1.6; margin-bottom: 10px; }
  .iw-actions { display: flex; gap: 6px; }
  .iw-actions a {
    flex: 1; text-align: center; padding: 7px 0;
    background: linear-gradient(135deg, #00f0ff, #9d5cff); color: #0a0e1a; text-decoration: none;
    border-radius: 6px; font-size: 12px; font-weight: 700; transition: all .2s;
  }
  .iw-actions a:hover { box-shadow: 0 0 14px rgba(0,240,255,0.6); }
  .iw-actions a.alt { background: rgba(0,240,255,0.1); color: #00f0ff; border: 1px solid rgba(0,240,255,0.3); }
  .iw-actions a.alt:hover { background: rgba(0,240,255,0.2); }

  /* ========== 浮动按钮（FAB） ========== */
  .fab {
    position: absolute; z-index: 998;
    width: 46px; height: 46px; border-radius: 50%;
    background: #111830; border: 1px solid rgba(0,240,255,0.4);
    box-shadow: 0 4px 16px rgba(0,240,255,0.25);
    color: #00f0ff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .fab:active { transform: scale(0.92); }
  .fab:hover { background: #1a2340; box-shadow: 0 0 18px rgba(0,240,255,0.5); }

  #fabMenu { top: 14px; left: 14px; }
  #fabFit { bottom: 80px; right: 14px; background: linear-gradient(135deg, #00f0ff, #9d5cff); color: #0a0e1a; font-size: 22px; border: none; }
  #fabFilter { bottom: 20px; right: 14px; }

  /* 过滤弹出层 */
  .filter-popup {
    position: absolute; bottom: 76px; right: 14px;
    background: #111830; border: 1px solid rgba(0,240,255,0.3);
    border-radius: 12px;
    padding: 10px; box-shadow: 0 4px 24px rgba(0,240,255,0.2);
    z-index: 998; display: none;
    flex-direction: column; gap: 6px;
    min-width: 140px;
  }
  .filter-popup.open { display: flex; }
  .filter-popup .chip { width: 100%; text-align: center; padding: 8px 12px; }

  /* 图例 */
  .map-legend {
    position: absolute; top: 14px; right: 14px; z-index: 997;
    background: rgba(10,14,26,0.9); padding: 8px 12px;
    border-radius: 8px; border: 1px solid rgba(0,240,255,0.3);
    box-shadow: 0 0 16px rgba(0,240,255,0.2);
    backdrop-filter: blur(4px); display: none;
  }
  .map-legend h4 { color: #00f0ff; font-size: 11px; margin-bottom: 4px; text-shadow: 0 0 6px rgba(0,240,255,0.5); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #9fb4d8; margin-bottom: 1px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

  /* ========== 桌面端样式（≥768px） ========== */
  @media (min-width: 768px) {
    #sidebar {
      transform: translateX(0);  /* 桌面端默认显示 */
      box-shadow: 2px 0 16px rgba(0,240,255,0.15);
    }
    #sidebar.collapsed { transform: translateX(-100%); }
    #backdrop { display: none; }  /* 桌面端不需要遮罩 */
    #fabMenu { display: none; }   /* 桌面端用sidebar自带的关闭按钮 */
    #fabFit, #fabFilter { display: none; }  /* 桌面端用地图自带控件 */
    .map-legend { display: block; }
  }

  /* ============================================================
     明亮卡通主题（body.light 时启用）
     ============================================================ */
  body.light {
    background: #fff8e7;
    color: #333;
  }
  body.light #sidebar {
    background: linear-gradient(180deg, #fff8e7 0%, #ffeed1 100%);
    border-right: 3px solid #ff6b35;
    box-shadow: 3px 0 18px rgba(255,107,53,0.25);
  }
  body.light #backdrop { background: rgba(0,0,0,0.4); }
  body.light .sidebar-header {
    background: linear-gradient(135deg, #ff6b35 0%, #ffd93d 60%, #00c2a8 100%);
    color: #fff;
    border-bottom: 3px solid #fff;
    box-shadow: 0 4px 14px rgba(255,107,53,0.35);
  }
  body.light .sidebar-header h1 {
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  body.light .sidebar-header .sub { color: #fff; }
  body.light .theme-btn {
    background: rgba(255,255,255,0.35);
    border: 2px solid #fff;
  }
  body.light .theme-btn:hover { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
  body.light .label-toggle .switch-label { color: #fff; }
  body.light .label-toggle.on .switch {
    background: linear-gradient(135deg, #4d6bfe, #00c2a8);
    box-shadow: 0 0 8px rgba(77,107,254,0.6);
  }
  body.light .label-toggle .switch {
    background: rgba(255,255,255,0.5);
    border: 2px solid #fff;
  }

  body.light .stats {
    background: #ffeed1;
    border-bottom: 2px dashed #ffd93d;
  }
  body.light .stat-label { color: #8a6d3b; }
  body.light .stat.s1 .stat-num { color: #ff4d6d; }
  body.light .stat.s2 .stat-num { color: #4d6bfe; }
  body.light .stat.s3 .stat-num { color: #ffa000; }
  body.light .stat.s4 .stat-num { color: #00b26a; }

  body.light .type-stats,
  body.light .dist-stats {
    background: #fff8e7;
    border-bottom: 2px dashed #ffd93d;
  }
  body.light .dist-stats .stat,
  body.light .type-stats .stat {
    background: #fff;
    border: 2px solid #f0d9a0;
  }
  body.light .dist-stats .stat:hover,
  body.light .type-stats .stat:hover {
    background: #fff3d6;
    box-shadow: 0 2px 8px rgba(255,107,53,0.2);
  }
  body.light .dist-stats .stat.active,
  body.light .type-stats .stat.active {
    background: linear-gradient(135deg, #4d6bfe 0%, #00c2a8 100%);
    color: #fff;
    border-color: #fff;
    box-shadow: 0 4px 12px rgba(77,107,254,0.35);
  }
  body.light .dist-stats .stat.active .stat-num,
  body.light .dist-stats .stat.active .stat-label,
  body.light .type-stats .stat.active .stat-num,
  body.light .type-stats .stat.active .stat-label { color: #fff; }
  body.light .dist-stats .stat-label,
  body.light .type-stats .stat-label { color: #8a6d3b; }

  body.light .search-box {
    background: #fff8e7;
    border-bottom: 2px dashed #ffd93d;
  }
  body.light .search-box input {
    background: #fff;
    border: 2px solid #f0d9a0;
    color: #333;
  }
  body.light .search-box input::placeholder { color: #bbb; }
  body.light .search-box input:focus {
    border-color: #4d6bfe;
    box-shadow: 0 0 0 3px rgba(77,107,254,0.15);
  }

  body.light .filter-chips { background: #fff8e7; border-bottom: 2px dashed #ffd93d; }
  body.light .chip {
    background: #fff; color: #8a6d3b;
    border: 2px solid #f0d9a0;
  }
  body.light .chip:hover { background: #ffefd2; }
  body.light .chip.active {
    background: linear-gradient(135deg, #ff6b35, #ffd93d);
    color: #fff;
    border-color: #ff6b35;
    box-shadow: 0 2px 8px rgba(255,107,53,0.3);
  }

  body.light .list-wrap { background: #fff8e7; }
  body.light .list-wrap::-webkit-scrollbar-track { background: #ffeed1; }
  body.light .list-wrap::-webkit-scrollbar-thumb { background: #f0d9a0; }
  body.light .list-item { border-bottom: 2px solid #ffe7c4; }
  body.light .list-item:hover { background: #ffefd2; }
  body.light .list-item.active {
    background: #e6f0ff;
    border-left: 4px solid #4d6bfe;
  }

  { name:'义乌中海店',                     addr:'城北区中海河山郡西区(门源路北50米)',            dist:'城北区', type:'电竞网咖', lat:36.6520, lng:101.7472 },

  { name:'新千外星人电竞',                addr:'城中区建国南路66号新千国际广场20号楼F5层',   dist:'城中区', type:'电竞网咖', lat:36.606, lng:101.798 },
  { name:'凡天电竞（胜利路店）胜利路巅峰',   addr:'城中区同仁路46号万兴大厦1号楼',              dist:'城中区', type:'电竞网咖', lat:36.626, lng:101.762 },
  { name:'弈客电竞',                     addr:'城西区西关大街84号2号楼84-8号',               dist:'城西区', type:'电竞网咖', lat:36.6343, lng:101.744 },
  { name:'横贯电竞（海湖店）',                  addr:'城西区五四西路唐道637步行街B3-402商铺',       dist:'城西区', type:'电竞网咖', lat:36.6435, lng:101.718 },
  { name:'横贯电竞(海湖万达五矿巅峰店)',    addr:'城西区五四西路66号4号楼2层66-254、66-256号', dist:'城西区', type:'电竞网咖', lat:36.6448, lng:101.7225 },
  { name:'凡天网咖（万达店）巅峰',           addr:'城西区海湖万达4楼 卓威电竞巅峰电竞',           dist:'城西区', type:'电竞网咖', lat:36.6425, lng:101.7165 },
  { name:'赛铂电竞(力盟店)',               addr:'城西区五四大街41号力盟商业巷步行街7号楼2楼202', dist:'城西区', type:'电竞网咖', lat:36.6285, lng:101.7578 },
  { name:'力盟超级综合体店',               addr:'万和电竞的3楼', dist:'城西区', type:'电竞网咖', lat:36.6295, lng:101.7578 },
  { name:'新华百货巅峰',                   addr:'城西区五四大街45号新华百货CCmall BT馆4F',     dist:'城西区', type:'电竞网咖', lat:36.630, lng:101.7575 },
  { name:'横贯（夏都店）',                   addr:'城东区夏都大街188号喆啡酒店东区负1层',       dist:'城东区', type:'电竞网咖', lat:36.6112, lng:101.7942 },
  // 电竞网咖+电竞酒店
  { name:'凡天电竞（宜博总店）精领酒店二医院巅峰', addr:'城西区古城台街道同仁路46号万兴大厦',     dist:'城西区', type:'电竞网咖+电竞酒店', lat:36.623, lng:101.7615 }
];

// =================== 状态 ===================
let map, infoWindow, activeIdx = -1;
let currentFilter = 'all', currentFilterDist = 'all', currentSearch = '';
let allMarkers = [];
let showLabels = false;  // 是否在地图上显示门店名称

// =================== 类型 → emoji 图标 ===================
const TYPE_EMOJI = { '电竞网咖':'⚔️', '电竞酒店':'🏨', '电竞网咖+电竞酒店':'⚔️🏨' };
const typeEmoji = t => TYPE_EMOJI[t] || '🏷️';

// =================== 统计 ===================
function updateStats() {
  const c = { '城中区':0,'城西区':0,'城东区':0,'城北区':0 };
  const t = { '电竞网咖':0, '电竞酒店':0, '电竞网咖+电竞酒店':0 };
  STORES.forEach(s => { c[s.dist]++; t[s.type] = (t[s.type]||0)+1; });
  // 区域统计
  document.getElementById('d-all').textContent = STORES.length;
  for (const k in c) document.getElementById('d-'+k).textContent = c[k];
  // 类型统计
  document.getElementById('c-all').textContent = STORES.length;
  document.getElementById('c-电竞网咖').textContent = t['电竞网咖']||0;
  document.getElementById('c-电竞酒店').textContent = t['电竞酒店']||0;
  document.getElementById('c-电竞网咖+电竞酒店').textContent = t['电竞网咖+电竞酒店']||0;
  // 同步弹层
  document.getElementById('m-c-all').textContent = STORES.length;
  document.getElementById('m-c-电竞网咖').textContent = t['电竞网咖']||0;
  document.getElementById('m-c-电竞酒店').textContent = t['电竞酒店']||0;
  document.getElementById('m-c-电竞网咖+电竞酒店').textContent = t['电竞网咖+电竞酒店']||0;
  document.getElementById('totalCount').textContent = `共 ${STORES.length} 家门店 · 点击查看详情`;
}

// =================== 渲染列表 ===================
function renderList() {
  const wrap = document.getElementById('listWrap');
  const filtered = STORES.filter(s => {
    const okType = currentFilter === 'all' || s.type === currentFilter;
    const okDist = currentFilterDist === 'all' || s.dist === currentFilterDist;
    const okSearch = !currentSearch || s.name.includes(currentSearch) || s.addr.includes(currentSearch);
    return okType && okDist && okSearch;
  });
  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">暂无匹配的门店</div>';
    return;
  }
  wrap.innerHTML = filtered.map(s => {
    const idx = STORES.indexOf(s);
    return `
    <div class="list-item ${idx === activeIdx ? 'active' : ''}" data-id="${idx}" onclick="focusStore(${idx})">
      <div class="row1">
        <span class="num d-${s.dist}">${idx + 1}</span>
        <span class="name">${s.name}</span>
        <span class="type-tag t-${s.type}">${typeEmoji(s.type)} ${s.type}</span>
        <span class="dist-tag">${s.dist}</span>
      </div>
      <div class="addr">${s.addr}</div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  renderList();
});
// 类型筛选（卡片式统计）
function selectTypeFilter(type, el) {
  currentFilter = type;
  // 同步侧边栏 + 弹层 + 移动端弹层的高亮态
  document.querySelectorAll('.type-stats .stat, .popup-stats .stat').forEach(x => {
    x.classList.toggle('active', x.dataset.type === type);
  });
  renderList();
  // 移动端选完关闭弹层
  if (window.innerWidth < 768) {
    document.getElementById('filterPopup').classList.remove('open');
  }
}
// 区域筛选（卡片式统计）
function selectDistFilter(dist, el) {
  currentFilterDist = dist;
  document.querySelectorAll('.dist-stats .stat').forEach(x => {
    x.classList.toggle('active', x.dataset.dist === dist);
  });
  renderList();
}

// =================== 抽屉控制 ===================
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const isMobile = () => window.innerWidth < 768;

function openDrawer() {
  sidebar.classList.add('open');
  if (isMobile()) backdrop.classList.add('open');
  setTimeout(() => map && map.resize(), 320);
}
function closeDrawer() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
  setTimeout(() => map && map.resize(), 320);
}

document.getElementById('fabMenu').addEventListener('click', openDrawer);
backdrop.addEventListener('click', closeDrawer);

// =================== 浮动按钮 ===================
document.getElementById('fabFit').addEventListener('click', fitAll);
document.getElementById('fabFilter').addEventListener('click', () => {
  document.getElementById('filterPopup').classList.toggle('open');
});

// =================== 地图初始化 ===================
function initMap() {
  const light = document.body.classList.contains('light');
  map = new AMap.Map('map', {
    center: [101.78, 36.63],
    zoom: 12,
    mapStyle: light ? 'amap://styles/light' : 'amap://styles/dark',
    features: ['bg','road','point']
  });

  infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -32) });

  STORES.forEach((s, i) => addMarker(s, i));
  fitAll();
  renderList();
}

// =================== 添加标记 ===================
function addMarker(store, idx) {
  const content = `
    <div class="custom-marker" data-id="${idx}">
      <div class="marker-inner d-${store.dist}">${typeEmoji(store.type)}</div>
      ${showLabels ? `<div class="marker-label">${store.name}</div>` : ''}
    </div>`;
  const marker = new AMap.Marker({
    position: [store.lng, store.lat],
    content: content,
    offset: new AMap.Pixel(-13, -13),
    extData: { id: idx }
  });
  marker._store = store;
  marker._idx = idx;
  marker.on('click', () => {
    selectStore(idx);
    showInfo(store);
    // 移动端点击标记后关闭抽屉
    if (isMobile()) closeDrawer();
  });
  marker.setMap(map);
  allMarkers.push(marker);
}

// 切换地图上门店名称的显示/隐藏
function setLabelVisibility(show) {
  showLabels = show;
  allMarkers.forEach(m => {
    const s = m._store, i = m._idx;
    m.setContent(`
      <div class="custom-marker" data-id="${i}">
        <div class="marker-inner d-${s.dist}">${typeEmoji(s.type)}</div>
        ${show ? `<div class="marker-label">${s.name}</div>` : ''}
      </div>`);
  });
}
document.getElementById('labelToggle').addEventListener('click', () => {
  showLabels = !showLabels;
  document.getElementById('labelToggle').classList.toggle('on', showLabels);
  setLabelVisibility(showLabels);
});

// =================== 主题切换 ===================
function applyTheme(light) {
  document.body.classList.toggle('light', light);
  document.getElementById('themeBtn').textContent = light ? '🌙' : '🌞';
  // 切换地图配色
  if (map) {
    map.setMapStyle(light ? 'amap://styles/light' : 'amap://styles/dark');
  }
}
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(!document.body.classList.contains('light'));
});

// =================== 信息窗 ===================
function showInfo(store) {
  const nameEnc = encodeURIComponent(store.name);
  const addrEnc = encodeURIComponent(store.addr);
  const mapUrl = `https://uri.amap.com/marker?position=${store.lng},${store.lat}&name=${nameEnc}&src=yungameweb`;
  const searchUrl = `https://ditu.amap.com/search?query=${addrEnc}&city=630100`;
  infoWindow.setContent(`
    <div style="padding:2px 0">
      <div class="iw-name">${typeEmoji(store.type)} ${store.name}</div>
      <span class="iw-dist">${store.dist}</span>
      <div class="iw-addr">📍 ${store.addr}</div>
      <div style="margin-bottom:8px;font-size:11px;color:#9fb4d8;">类别：${store.type}</div>
      <div class="iw-actions">
        <a href="${mapUrl}" target="_blank">📍 高德查看</a>
        <a href="${searchUrl}" target="_blank" class="alt">🔍 搜索详情</a>
      </div>
    </div>`);
  infoWindow.open(map, [store.lng, store.lat]);
}

// =================== 聚焦门店 ===================
function focusStore(id) {
  const store = STORES[id];
  if (!store) return;
  selectStore(id);
  // 先移到目标位置，等动画完成后再弹窗，避免信息窗干扰居中
  map.setZoomAndCenter(16, [store.lng, store.lat]);
  setTimeout(() => {
    // 修正侧边栏偏移：让标记在"可视区域"正中，而非地图容器正中
    const sidebarEl = document.getElementById('sidebar');
    const isSidebarOpen = sidebarEl.classList.contains('open') || !isMobile();
    const sidebarW = isSidebarOpen ? sidebarEl.offsetWidth : 0;
    if (sidebarW > 0) {
      const mapW = map.getContainer().offsetWidth;
      const visibleCenter = (mapW - sidebarW) / 2 + sidebarW;
      const dx = visibleCenter - mapW / 2;
      if (Math.abs(dx) > 5) map.panBy([dx, 0]);
    }
    showInfo(store);
  }, 500);
  // 移动端：点击列表项后关闭抽屉
  if (isMobile()) {
    setTimeout(closeDrawer, 600);
  }
}

function selectStore(id) {
  activeIdx = id;
  document.querySelectorAll('.marker-inner').forEach(el => el.classList.remove('active'));
  const mk = document.querySelector(`.custom-marker[data-id="${id}"]`);
  if (mk) {
    const inner = mk.querySelector('.marker-inner');
    if (inner) inner.classList.add('active');
  }
  renderList();
}

// =================== 全览 ===================
function fitAll() {
  if (allMarkers.length) {
    map.setFitView(allMarkers, false, [30, 30, 30, 30]);
  }
}

// =================== 启动 ===================
updateStats();
selectTypeFilter('all');
selectDistFilter('all');
const waitAMap = () => {
  if (typeof AMap !== 'undefined' && AMap.Map) {
    initMap();
  } else {
    setTimeout(waitAMap, 200);
  }
};
waitAMap();

// 屏幕旋转 / 尺寸变化时重新适配
window.addEventListener('resize', () => {
  if (map) map.resize();
});
</script>
